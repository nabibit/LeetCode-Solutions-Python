name: Python Tests

on: [push]

jobs:
  test:
    # Fix: Downgrade from ubuntu-latest/ubuntu-26.04 to a version that supports Python 3.8 - 3.11
    runs-on: ubuntu-24.04 
    strategy:
      matrix:
        python-version: ['3.8', '3.9', '3.10', '3.11']

    steps:
    # Update to v4 to fix the Node.js 20 deprecation warning shown in your logs
    - uses: actions/checkout@v4 
    
    - name: Set up Python ${{ matrix.python-version }}
      # Update to v5 for the latest Node/runner compatibility
      uses: actions/setup-python@v5 
      with:
        python-version: ${{ matrix.python-version }}
        
    - name: Run Tests
      run: |
        python -m unittest discover